name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land against an unchanged lockfile. A weekly run on main keeps
  # the core audit gate from first failing at release time.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push to a pull request supersedes its in-flight run. Pushes to main and
# scheduled runs each get their own group so none of them is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The multilingual encoder is an optional peer and is not installed here.
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # The examples import the built dist/ directly and make no network calls.
      - name: Run examples
        shell: bash
        run: |
          for example in examples/*.mjs; do
            echo "::group::${example}"
            node "${example}"
            echo "::endgroup::"
          done

  supply-chain:
    name: Core dependency and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:core
      - run: npm run smoke:package
